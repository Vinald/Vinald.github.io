<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title }}</title>
        <meta name="description" content="Portfolio of Okiror Samuel Vinald - Software Developer" />
        <link rel="icon" href="/assets/images/white.png" type="image/x-icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="/assets/css/styles.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    <img src="/assets/images/black.png" alt="Vinald Logo" height="35" class="d-inline-block align-text-top me-2" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center gap-2">
                        <li class="nav-item">
                            <a href="/" class="nav-link"><i class="bi bi-house me-1"></i>Portfolio</a>
                        </li>
                        <li class="nav-item">
                            <a href="/#projects" class="nav-link">All Projects</a>
                        </li>
                        {% if page.github_url %}
                        <li class="nav-item">
                            <a href="{{ page.github_url }}" class="btn btn-info btn-sm" target="_blank" rel="noopener">
                                <i class="bi bi-github me-1"></i>GitHub
                            </a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container text-light py-4">
            {{ content }}
        </div>

        <footer class="bg-dark text-light text-center py-2">
            <p class="mb-0">&copy; <span id="currentYear"></span> Okiror Samuel Vinald</p>
        </footer>

        <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
