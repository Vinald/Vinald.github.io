<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title }}</title>
        <link rel="icon" href="/assets/images/white.png" type="image/x-icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/assets/css/styles.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-md bg-light navbar-light sticky-top">
            <div class="container">
                <a class="navbar-brand" href="/">OKIROR SAMUEL VINALD</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="/" class="nav-link">Main Page</a>
                        </li>
                        {% if page.github_url %}
                        <li>
                            <a href="{{ page.github_url }}" class="btn btn-info" target="_blank" rel="noopener">GitHub</a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container text-light">
            {{ content }}
        </div>

        <footer class="bg-dark text-light text-center py-2">
            <p>&copy; <span id="currentYear"></span> Okiror Samuel Vinald</p>
        </footer>

        <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
