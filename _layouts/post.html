<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            (function () {
                var saved = localStorage.getItem('theme');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            })();
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title }} - Vinald's Blog</title>
        <meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 30 | default: 'Blog post by Okiror Samuel Vinald' }}" />
        <link rel="icon" href="/assets/images/white.png" type="image/x-icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" integrity="sha384-l4UPAMHGzl7zwogLW4nOwaU2XTk6oiM1jhCRQstZEndoIiA2I5bg6fST3wzBSRBD" crossorigin="anonymous" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="/assets/css/styles.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-dark sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    <img src="/assets/images/white.png" alt="Vinald Logo" height="32" class="d-inline-block align-text-top me-2" />
                </a>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light / dark mode">
                    <i class="bi bi-sun" id="themeToggleIcon"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center gap-2">
                        <li class="nav-item">
                            <a href="/" class="nav-link"><i class="bi bi-house me-1"></i>Portfolio</a>
                        </li>
                        <li class="nav-item">
                            <a href="/blog/" class="nav-link">All Posts</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <article class="container py-4" style="max-width: 760px">
            <h1 class="fw-bold mb-2">{{ page.title }}</h1>
            <p class="text-muted mb-4">
                <i class="bi bi-calendar3 me-1"></i>{{ page.date | date: "%B %-d, %Y" }}
                {% if page.tags.size > 0 %}
                    <span class="ms-2">
                        {% for tag in page.tags %}<span class="badge bg-warning text-dark me-1">{{ tag }}</span>{% endfor %}
                    </span>
                {% endif %}
            </p>
            <div class="post-content lead">
                {{ content }}
            </div>
        </article>

        <footer class="bg-dark text-light text-center py-3 mt-4">
            <p class="mb-0">&copy; <span id="currentYear"></span> Okiror Samuel Vinald</p>
        </footer>

        <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="/assets/js/theme-toggle.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr" crossorigin="anonymous"></script>
        <script>
            mermaid.initialize({
                startOnLoad: true,
                theme: document.documentElement.getAttribute('data-theme') === 'light' ? 'default' : 'dark',
            });
        </script>
    </body>
</html>
