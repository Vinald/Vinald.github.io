<section id="contact" class="py-5 px-2 py-md-5 px-md-3 bg-dark text-light">
    <div class="container">
        <h2 class="text-center mb-4 text-uppercase fw-bold">Get In Touch</h2>
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="text-center mb-5 lead">I'm always interested in hearing about new projects and opportunities. Feel free to reach out!</p>

                <form id="contactForm" class="needs-validation">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control bg-secondary text-light border-0" id="name" name="name" required placeholder="Your Name" />
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control bg-secondary text-light border-0" id="email" name="email" required placeholder="your@email.com" />
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control bg-secondary text-light border-0" id="subject" name="subject" required placeholder="What is this about?" />
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control bg-secondary text-light border-0" id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-warning btn-lg rounded-pill px-5 fw-bold" id="submitBtn">Send Message</button>
                        <div id="formStatus" class="mt-3"></div>
                    </div>
                </form>

                <hr class="my-5" />

                <div class="row g-4 text-center">
                    <div class="col-md-6">
                        <div class="card bg-secondary border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="card-title text-warning mb-3"><i class="bi bi-envelope-fill"></i> Email</h5>
                                <p class="card-text mb-3">okiror1vinald@gmail.com</p>
                                <button class="btn btn-outline-warning btn-sm" onclick="copyToClipboard('okiror1vinald@gmail.com')">Copy Email</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card bg-secondary border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="card-title text-warning mb-3"><i class="bi bi-telephone-fill"></i> Phone</h5>
                                <p class="card-text mb-3">+256 746 178 844</p>
                                <button class="btn btn-outline-warning btn-sm" onclick="copyToClipboard('+256 746 178 844')">Copy Phone</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
